services:

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foton-detailing-backend
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - foton-detailing-network

  nginx:
    image: nginx:alpine
    container_name: foton-detailing-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - foton-detailing-network

  frontend:
    image: node:22.13.0-alpine
    container_name: foton-detailing-frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - foton-detailing-network

  mysql:
    image: mysql:8.4
    container_name: foton-detailing-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - foton-detailing-network

  redis:
    image: redis:7.4-alpine
    container_name: foton-detailing-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - foton-detailing-network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foton-detailing-worker
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - mysql
    networks:
      - foton-detailing-network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foton-detailing-scheduler
    working_dir: /var/www/backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - mysql
    networks:
      - foton-detailing-network

networks:
  foton-detailing-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
